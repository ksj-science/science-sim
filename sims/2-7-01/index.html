<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지구 자전과 겉보기 운동</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../lib/sim.css">
<style>
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; }
  .sim-header { padding: 8px 18px; }
  .sim-main { flex: 1; min-height: 0; grid-template-columns: 400px 1fr; padding: 10px 16px; gap: 12px; }
  .col { display: grid; gap: 12px; min-height: 0; }
  .left { grid-template-rows: auto 1fr; }
  .right { grid-template-rows: 1fr auto; }
  .panel { padding: 10px 14px; min-height: 0; }
  .panel h2 { margin: 0 0 6px; font-size: 15px; }
  .fill { display: flex; flex-direction: column; }
  .canvas-box { flex: 1; min-height: 0; position: relative; }
  .canvas-box canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 10px; touch-action: none; }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .title-row h2 { margin: 0; }
  #sky { cursor: grab; } #sky.grabbing, #cel.grabbing { cursor: grabbing; } #cel { cursor: grab; }
  canvas[hidden] { display: none; }

  /* ① 방향 정하기 */
  .place { display: grid; grid-template-columns: 190px 1fr; gap: 10px; align-items: center; }
  .globe { position: relative; width: 190px; height: 170px; }
  .globe svg { position: absolute; inset: 0; }
  .slot { position: absolute; width: 36px; height: 36px; border-radius: 9px; background: rgba(255,255,255,.92);
          border: 2px dashed #8a94a6; display: flex; align-items: center; justify-content: center; }
  .slot.over { border-color: var(--accent); background: var(--accent-soft); }
  .tray { display: flex; gap: 8px; flex-wrap: wrap; min-height: 40px; padding: 4px 0; }
  .tile { width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 8px; font-size: 16px; font-weight: 700;
          background: #fff7e0; border: 1px solid #e0b84f; color: #6b4b00; touch-action: none; user-select: none; }
  .tile.sel { outline: 3px solid var(--accent); }
  .tile.drag { position: fixed; z-index: 10; pointer-events: none; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .slot .tile { width: 30px; height: 30px; }

  .seg button { padding: 6px 14px; }
  .ctrl { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 16px; align-items: center; }
  .ctrl .control { min-width: 0; }
  .readout { display: flex; gap: 8px; }
  .readout div { background: var(--bg); border-radius: 10px; padding: 4px 12px; font-size: 13px; color: var(--muted); white-space: nowrap; }
  .readout b { display: block; font-size: 19px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .opt { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; font-size: 14px; }
  .opt .lab { color: var(--muted); }
</style>
</head>
<body>
<header class="sim-header">
  <h1>지구 자전과 겉보기 운동</h1>
  <span class="unit">Ⅶ. 태양계 · 2. 지구와 달 · 01 — 지구가 자전하면 별은 어떻게 움직이는 것처럼 보일까?</span>
</header>
<main class="sim-main">
  <section class="col left">
    <div class="panel">
      <h2>① 우리나라를 기준으로 방향 정하기</h2>
      <div class="place">
        <div class="globe" id="globe">
          <svg viewBox="0 0 190 170" aria-hidden="true">
            <defs>
              <radialGradient id="sea" cx="40%" cy="35%" r="70%">
                <stop offset="0" stop-color="#5aa3e6"/><stop offset="1" stop-color="#1c4f8f"/>
              </radialGradient>
            </defs>
            <line x1="95" y1="2" x2="95" y2="168" stroke="#555" stroke-width="2"/>
            <circle cx="95" cy="85" r="74" fill="url(#sea)"/>
            <path d="M40 40 C60 30 80 42 88 52 C92 60 84 70 78 74 C70 80 74 92 66 100 C56 106 42 96 34 84 C28 70 30 52 40 40Z" fill="#6da35a" opacity=".9"/>
            <path d="M104 70 C108 66 112 68 112 74 C112 80 108 86 104 84 C101 80 102 74 104 70Z" fill="#7fb36a"/>
            <path d="M118 58 C124 52 132 58 128 66 C124 72 120 80 116 78 C114 72 114 64 118 58Z" fill="#6da35a" opacity=".9"/>
            <path d="M58 120 C72 116 86 124 84 134 C80 144 64 146 56 138 C50 132 50 124 58 120Z" fill="#6da35a" opacity=".85"/>
            <ellipse cx="95" cy="85" rx="74" ry="14" fill="none" stroke="#fff" stroke-opacity=".35" stroke-dasharray="3 3" transform="translate(0 30)"/>
            <circle cx="106" cy="76" r="4" fill="#e5533d" stroke="#fff" stroke-width="1.5"/>
            <text x="100" y="166" font-size="10" text-anchor="start" fill="#333">자전축</text>
          </svg>
          <div class="slot" data-pos="0" style="left:88px; top:30px"></div>
          <div class="slot" data-pos="1" style="left:122px; top:58px"></div>
          <div class="slot" data-pos="2" style="left:88px; top:86px"></div>
          <div class="slot" data-pos="3" style="left:54px; top:58px"></div>
        </div>
        <div>
          <div class="hint">빨간 점이 우리나라예요. 지구의 위쪽이 북극입니다. 글자 카드를 끌어다(또는 눌러 고른 뒤 칸을 눌러) 네 칸에 놓아 보세요.</div>
          <div class="tray" id="tray">
            <button class="tile" data-d="동">동</button>
            <button class="tile" data-d="서">서</button>
            <button class="tile" data-d="남">남</button>
            <button class="tile" data-d="북">북</button>
          </div>
        </div>
      </div>
    </div>
    <div class="panel fill">
      <div class="title-row">
        <h2>② 모형으로 보기</h2>
        <div class="seg" id="tabSeg">
          <button data-v="top" aria-pressed="true">지구 모형</button>
          <button data-v="cel" aria-pressed="false">천구</button>
        </div>
      </div>
      <div class="canvas-box">
        <canvas id="top" aria-label="북극 위에서 내려다본 지구와 별자리 구"></canvas>
        <canvas id="cel" aria-label="관측자를 중심으로 한 천구" hidden></canvas>
      </div>
      <div class="hint" id="tabHint" style="margin-top:4px"></div>
    </div>
  </section>
  <section class="col right">
    <div class="panel fill">
      <div class="title-row">
        <h2>③ 우리나라의 관측자가 본 밤하늘 <span class="hint" style="font-weight:400">— 하늘을 좌우로 끌어서 둘러보세요</span></h2>
        <div class="opt"><span class="lab">바로 보기</span>
          <div class="seg" id="dirSeg">
            <button data-v="북" aria-pressed="true">북쪽</button>
            <button data-v="동" aria-pressed="false">동쪽</button>
            <button data-v="남" aria-pressed="false">남쪽</button>
            <button data-v="서" aria-pressed="false">서쪽</button>
          </div>
        </div>
      </div>
      <div class="canvas-box"><canvas id="sky" aria-label="관측자가 본 하늘"></canvas></div>
    </div>
    <div class="panel ctrl">
      <div class="btn-row">
        <button id="play" class="primary" style="min-width:96px">▶ 재생</button>
        <button id="clear">궤적 지우기</button>
        <button id="reset">처음부터</button>
      </div>
      <div class="control">
        <label for="time">경과 시간 <output id="timeOut">0.0시간</output></label>
        <input id="time" type="range" min="0" max="24" step="0.1" value="0">
      </div>
      <div class="readout">
        <div>경과 시간<b id="hOut">0시간</b></div>
        <div>지구가 회전한 각도<b id="aOut">0°</b></div>
      </div>
      <div class="opt" style="grid-column: 1 / -1">
        <span class="lab">지구를 돌리는 방향</span>
        <div class="seg" id="senseSeg">
          <button data-v="ccw" aria-pressed="true">시계 반대 방향 (실제 지구)</button>
          <button data-v="cw" aria-pressed="false">시계 방향 (만약 반대로 돈다면?)</button>
        </div>
        <span class="hint">하늘의 밝은 끝이 별의 지금 위치, 흐린 꼬리가 지나온 길이에요.</span>
      </div>
    </div>
  </section>
</main>
<script src="../../lib/sim-bridge.js"></script>
<script>
(function () {
  /* 단순화: 관측 위도 37.5°N 고정, 북극성은 천구의 북극에 둠, 낮·태양·대기 효과 없음, 별 배치는 대부분 가상 */
  var D2R = Math.PI / 180, LAT = 37.5 * D2R, SPEED = 1.5;   // SPEED: 실제 1초에 1.5시간
  var LST0 = 4;                                              // 시작 시각의 항성시(시)
  var sphi = Math.sin(LAT), cphi = Math.cos(LAT);
  var $ = function (id) { return document.getElementById(id); };

  // ---------- 별 자료 (적경 h, 적위 °, 밝기 0~1) ----------
  var CONS = [
    { name: '북두칠성', lines: [[0,1],[1,2],[2,3],[3,0],[3,4],[4,5],[5,6]], stars: [
      [11.06,61.75], [11.03,56.38], [11.90,53.69], [12.26,57.03], [12.90,55.96], [13.40,54.93], [13.79,49.31]] },
    { name: '카시오페이아자리', lines: [[0,1],[1,2],[2,3],[3,4]], stars: [
      [0.15,59.15], [0.675,56.54], [0.945,60.72], [1.43,60.24], [1.90,63.67]] },
    { name: '오리온자리', lines: [[0,2],[1,4],[2,3],[3,4],[2,5],[4,6],[0,1]], stars: [
      [5.92,7.41], [5.42,6.35], [5.68,-1.94], [5.60,-1.20], [5.53,-0.30], [5.80,-9.67], [5.24,-8.20]] },
    { name: '사자자리', lines: [[0,1],[1,2],[2,3],[0,4],[4,5],[5,3]], stars: [
      [10.14,11.97], [10.33,19.84], [10.28,23.42], [9.88,26.0], [11.24,15.43], [11.82,14.57]] },
    { name: '전갈자리', lines: [[0,1],[1,2],[1,3],[3,4],[4,5]], stars: [
      [16.0,-22.6], [16.49,-26.43], [16.0,-19.8], [16.84,-34.29], [17.2,-43.2], [17.56,-37.1]] }
  ];
  var stars = [];
  var seed = 7;
  function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  stars.push({ ra: 0, dec: 90, mag: 1, polaris: true });
  CONS.forEach(function (c) {
    c.idx = c.stars.map(function (s) { stars.push({ ra: s[0], dec: s[1], mag: 0.85 }); return stars.length - 1; });
  });
  for (var i = 0; i < 320; i++) {
    var sd = rnd() * 1.77 - 0.77;                 // sin(적위): -50° ~ +90°
    stars.push({ ra: rnd() * 24, dec: Math.asin(sd) / D2R, mag: Math.pow(rnd(), 2.2) * 0.75 + 0.1 });
  }
  stars.forEach(function (s) {
    s.sd = Math.sin(s.dec * D2R); s.cd = Math.cos(s.dec * D2R); s.a = s.ra * 15 * D2R;
    var t = rnd(); s.col = t < 0.2 ? '255,214,170' : t < 0.45 ? '190,215,255' : '255,255,255';
  });

  // ---------- 상태 ----------
  var hours = 0, trailFrom = 0, sense = 1, viewAz = 0, viewDir = '북', playing = false, last = null;
  var lastH = 0, tab = 'top', celB = 125, celEl = 22, celSeen = false;
  var WIND = ['북', '북동', '동', '남동', '남', '남서', '서', '북서'];
  function norm(a) { a %= 360; return a < 0 ? a + 360 : a; }
  function angDiff(a, b) { var d = norm(a - b); return d > 180 ? d - 360 : d; }
  function cardinal(az) { return ['북', '동', '남', '서'][Math.round(norm(az) / 90) % 4]; }
  function windName(az) { return WIND[Math.round(norm(az) / 45) % 8]; }
  var viewed = {}, placed = ['', '', '', ''];
  function lst(h) { return LST0 + sense * h; }      // 시

  // ---------- 캔버스 크기 맞추기 ----------
  function fit(cv) {
    var r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    var w = Math.max(10, Math.round(r.width)), h = Math.max(10, Math.round(r.height));
    if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
    var ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    return { ctx: ctx, w: w, h: h };
  }

  // ---------- 하늘 투영 ----------
  var AZ = { '북': 0, '동': 90, '남': 180, '서': 270 };
  var SIDE = { '북': ['서', '동'], '동': ['북', '남'], '남': ['동', '서'], '서': ['남', '북'] };
  function enu(H, s) {   // H: 시간각(rad)
    var cH = Math.cos(H);
    return [-s.cd * Math.sin(H), s.sd * cphi - s.cd * cH * sphi, s.sd * sphi + s.cd * cH * cphi];
  }
  function camera(w, h) {
    var A0 = viewAz * D2R, S = (w / 2) / (2 * Math.tan(55 * D2R / 2));
    var c = 2 * Math.atan(0.36 * h / (2 * S));       // 지평선이 화면 아래 86% 높이에 오도록
    var f = [Math.cos(c) * Math.sin(A0), Math.cos(c) * Math.cos(A0), Math.sin(c)];
    var r = [Math.cos(A0), -Math.sin(A0), 0];
    var u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
    return { f: f, r: r, u: u, S: S, cx: w / 2, cy: h / 2 };
  }
  function proj(cam, p) {
    var z = p[0] * cam.f[0] + p[1] * cam.f[1] + p[2] * cam.f[2];
    if (z < -0.2) return null;
    var k = 2 / (1 + z) * cam.S;
    return [cam.cx + (p[0] * cam.r[0] + p[1] * cam.r[1] + p[2] * cam.r[2]) * k,
            cam.cy - (p[0] * cam.u[0] + p[1] * cam.u[1] + p[2] * cam.u[2]) * k];
  }
  function azAlt(az, alt) { return [Math.cos(alt) * Math.sin(az), Math.cos(alt) * Math.cos(az), Math.sin(alt)]; }
  function hill(az) { return (1.2 + 1.0 * Math.sin(az * 3.1 + 1) + 0.7 * Math.sin(az * 7.3) + 0.4 * Math.sin(az * 17.0 + 2)) * D2R; }

  function drawSky() {
    var o = fit($('sky')), g = o.ctx, w = o.w, h = o.h, cam = camera(w, h);
    var bg = g.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0, '#050b1c'); bg.addColorStop(0.75, '#0f2346'); bg.addColorStop(1, '#1d3a66');
    g.fillStyle = bg; g.fillRect(0, 0, w, h);
    var L0 = lst(hours), span = hours - trailFrom;
    var n = Math.min(150, Math.max(1, Math.ceil(Math.abs(span) / 0.05)));
    g.lineCap = 'round';
    for (var i = 0; i < stars.length; i++) {
      var s = stars[i];
      var pNow = proj(cam, enu((L0 * 15) * D2R - s.a, s));
      if (span > 0.001) {
        var pts = [];
        for (var k = 0; k <= n; k++) {
          var hh = trailFrom + span * k / n;
          pts.push(proj(cam, enu(lst(hh) * 15 * D2R - s.a, s)));
        }
        var groups = 6;
        g.lineWidth = s.polaris ? 2.2 : 0.6 + s.mag * 1.4;
        for (var q = 0; q < groups; q++) {
          var a0 = Math.floor(n * q / groups), a1 = Math.floor(n * (q + 1) / groups);
          g.strokeStyle = 'rgba(' + s.col + ',' + ((0.12 + 0.75 * (q + 1) / groups) * (0.35 + 0.65 * s.mag)).toFixed(3) + ')';
          g.beginPath(); var started = false;
          for (var m = a0; m <= a1; m++) {
            var p = pts[m];
            if (!p || p[0] < -50 || p[0] > w + 50 || p[1] < -50 || p[1] > h + 50) { started = false; continue; }
            if (!started) { g.moveTo(p[0], p[1]); started = true; } else g.lineTo(p[0], p[1]);
          }
          g.stroke();
        }
      }
      if (pNow && pNow[0] > -5 && pNow[0] < w + 5 && pNow[1] > -5 && pNow[1] < h + 5) {
        g.fillStyle = 'rgba(' + s.col + ',' + (0.45 + 0.55 * s.mag).toFixed(2) + ')';
        g.beginPath(); g.arc(pNow[0], pNow[1], s.polaris ? 3.6 : 0.7 + s.mag * 2.2, 0, 7); g.fill();
        if (s.polaris) { g.fillStyle = '#ffe38a'; g.font = '600 14px ' + getComputedStyle(document.body).fontFamily; g.fillText('북극성', pNow[0] + 8, pNow[1] - 8); }
      }
    }
    // 별자리 선과 이름
    g.font = '13px ' + getComputedStyle(document.body).fontFamily;
    CONS.forEach(function (c) {
      var P = c.idx.map(function (j) { return proj(cam, enu(L0 * 15 * D2R - stars[j].a, stars[j])); });
      g.strokeStyle = 'rgba(140,190,255,.45)'; g.lineWidth = 1;
      c.lines.forEach(function (ln) {
        var a = P[ln[0]], b = P[ln[1]];
        if (a && b) { g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); }
      });
      var cx = 0, cy = 0, cnt = 0;
      P.forEach(function (p) { if (p) { cx += p[0]; cy += p[1]; cnt++; } });
      if (cnt === P.length) { g.fillStyle = 'rgba(170,205,255,.85)'; g.textAlign = 'center'; g.fillText(c.name, cx / cnt, Math.max.apply(null, P.map(function (p) { return p[1]; })) + 18); }
    });
    g.textAlign = 'left';
    // 땅(산 능선)
    var A0 = viewAz * D2R, ff = getComputedStyle(document.body).fontFamily;
    g.fillStyle = '#0a0f12'; g.beginPath();
    var first = true;
    for (var d = -80; d <= 80; d += 1) {
      var az = A0 + d * D2R, p2 = proj(cam, azAlt(az, hill(az)));
      if (!p2) continue;
      if (first) { g.moveTo(p2[0], p2[1]); first = false; } else g.lineTo(p2[0], p2[1]);
    }
    g.lineTo(w + 10, h + 10); g.lineTo(-10, h + 10); g.closePath(); g.fill();
    // 방위 글자 (지평선 아래 땅 위에)
    g.textAlign = 'center';
    for (var k8 = 0; k8 < 8; k8++) {
      var azk = k8 * 45, dd = angDiff(azk, viewAz);
      if (Math.abs(dd) > 60) continue;
      var pk = proj(cam, azAlt(azk * D2R, 0));
      if (!pk || pk[0] < 18 || pk[0] > w - 18) continue;
      var big = k8 % 2 === 0;
      g.fillStyle = big ? '#fff' : 'rgba(255,255,255,.6)';
      g.font = (big ? '700 24px ' : '600 15px ') + ff;
      g.fillText(WIND[k8], pk[0], Math.min(h - 14, pk[1] + (big ? 40 : 34)));
      g.fillRect(pk[0] - 0.75, pk[1] + 6, 1.5, big ? 10 : 6);
    }
    g.textAlign = 'left';
    g.fillStyle = 'rgba(255,255,255,.8)'; g.font = '13px ' + ff;
    g.fillText(windName(viewAz) + '쪽 하늘 (방위각 ' + Math.round(norm(viewAz)) + '°) · 궤적 ' + Math.max(0, span).toFixed(1) + '시간', 12, 20);
  }

  // ---------- 북극 위에서 본 지구 ----------
  var topGeom = null;
  function arrow(g, x0, y0, x1, y1, col, wdt) {
    var a = Math.atan2(y1 - y0, x1 - x0);
    g.strokeStyle = col; g.fillStyle = col; g.lineWidth = wdt;
    g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1 - 7 * Math.cos(a), y1 - 7 * Math.sin(a)); g.stroke();
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x1 - 10 * Math.cos(a - 0.45), y1 - 10 * Math.sin(a - 0.45));
    g.lineTo(x1 - 10 * Math.cos(a + 0.45), y1 - 10 * Math.sin(a + 0.45)); g.closePath(); g.fill();
  }
  function drawTop() {
    var o = fit($('top')), g = o.ctx, w = o.w, h = o.h;
    var cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 6, re = R * 0.34;
    var ff = getComputedStyle(document.body).fontFamily;
    topGeom = { cx: cx, cy: cy, re: re, R: R };
    g.clearRect(0, 0, w, h);
    // 별자리 구 (투명한 구)
    var bg = g.createRadialGradient(cx, cy, re, cx, cy, R);
    bg.addColorStop(0, '#152a52'); bg.addColorStop(1, '#0a1530');

    selTile = t === selTile ? null : t; if (selTile) selTile.classList.add('sel');
  }
  document.querySelectorAll('.tile').forEach(function (t) {
    t.addEventListener('pointerdown', function (e) {
      if (SimBridge.locked) return;
      e.preventDefault(); e.stopPropagation();
      start = { x: e.clientX, y: e.clientY, tile: t, moved: false };
      t.setPointerCapture(e.pointerId);
    });
    t.addEventListener('pointermove', function (e) {
      if (!start || start.tile !== t) return;
      if (!start.moved && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 6) {
        start.moved = true; dragTile = t; t.classList.add('drag');
      }
      if (start.moved) {
        t.style.left = (e.clientX - 17) + 'px'; t.style.top = (e.clientY - 17) + 'px';
        document.querySelectorAll('.slot').forEach(function (s) { s.classList.remove('over'); });
        var s = slotAt(e.clientX, e.clientY); if (s) s.classList.add('over');
      }
    });
    t.addEventListener('pointerup', function (e) {
      if (!start || start.tile !== t) return;
      if (start.moved) {
        t.classList.remove('drag'); t.style.left = t.style.top = '';
        document.querySelectorAll('.slot').forEach(function (s) { s.classList.remove('over'); });
        putIn(t, slotAt(e.clientX, e.clientY)); dragTile = null;
        if (selTile) { selTile.classList.remove('sel'); selTile = null; }
      } else if (t.parentNode.classList.contains('slot')) {
        if (selTile && selTile !== t) { var sl = t.parentNode; putIn(selTile, sl); selTile.classList.remove('sel'); selTile = null; }
        else { if (selTile) select(selTile); putIn(t, null); }
      } else select(t);
      start = null;
    });
  });
  function slotAt(x, y) {
    var hit = null;
    document.querySelectorAll('.slot').forEach(function (s) {
      var r = s.getBoundingClientRect();
      if (x >= r.left - 6 && x <= r.right + 6 && y >= r.top - 6 && y <= r.bottom + 6) hit = s;
    });
    return hit;
  }
  document.querySelectorAll('.slot').forEach(function (s) {
    s.addEventListener('click', function () {
      if (SimBridge.locked || !selTile) return;
      putIn(selTile, s); selTile.classList.remove('sel'); selTile = null;
    });
  });
  tray.addEventListener('click', function (e) {
    if (e.target === tray && selTile && selTile.parentNode !== tray) { putIn(selTile, null); select(selTile); }
  });

  window.addEventListener('resize', render);
  render(); pushState(true);
})();
</script>
</body>
</html>
