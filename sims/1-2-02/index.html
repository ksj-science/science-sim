<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토끼 무리의 대모험 — 변이와 생물의 다양성</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../../lib/sim.css">
<link rel="stylesheet" href="../../lib/vendor/jua-5.3.0/jua.css">
<style>
  :root {
    --ink: #22324a; --muted: #66748a; --line: #e2e7ef; --bg: #eef3f6;
    --coral: #ff7657; --coral-d: #e85a3c; --teal: #17a398; --violet: #7b4fd6;
    --grassC: #2e8b3e; --sandC: #b07a2a;
    --shadow: 0 8px 24px rgba(34, 50, 74, .10);
    --display: "Jua", "Pretendard", "Noto Sans KR", sans-serif;
  }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; background: radial-gradient(1200px 600px at 20% -10%, #fff7ec 0%, transparent 60%), var(--bg);
         user-select: none; -webkit-user-select: none; }
  .display { font-family: var(--display); font-weight: 400; letter-spacing: .2px; }

  /* ---------- 머리줄 ---------- */
  header.top { height: 60px; flex: none; display: flex; align-items: center; gap: 14px; padding: 0 16px; }
  .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .brand .badge { font-size: 12px; font-weight: 700; color: #fff; background: var(--violet); border-radius: 8px; padding: 3px 8px; white-space: nowrap; }
  .brand h1 { margin: 0; font-size: 24px; color: var(--ink); white-space: nowrap; }
  .brand small { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .steps { flex: 1; display: flex; align-items: center; justify-content: center; gap: 0; margin: 0; padding: 0; list-style: none; }
  .steps li { display: flex; align-items: center; gap: 6px; color: #9aa6b8; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
  .steps li .dot { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: #dfe5ee; color: #fff;
                   font-family: var(--display); font-size: 15px; transition: background .3s, transform .3s; }
  .steps li.done .dot { background: #b9a3ea; }
  .steps li.on { color: var(--ink); }
  .steps li.on .dot { background: var(--violet); transform: scale(1.12); box-shadow: 0 0 0 4px rgba(123,79,214,.18); }
  .steps .bar { width: 14px; height: 3px; background: #dfe5ee; border-radius: 2px; margin: 0 6px; }
  .steps .bar.done { background: #b9a3ea; }
  .top-btns { display: flex; gap: 8px; }
  .top-btns button { white-space: nowrap; min-height: 38px; padding: 6px 14px; border-radius: 12px; font-size: 14px; background: #fff; border: 1px solid var(--line); box-shadow: 0 2px 6px rgba(34,50,74,.06); }
  .top-btns #bChallenge { border-color: #f3c3b6; color: var(--coral-d); }

  /* ---------- 본문 ---------- */
  main.stage-main { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 350px; gap: 12px; padding: 0 12px 12px; }
  .scene-wrap { position: relative; min-height: 0; border-radius: 20px; overflow: hidden; box-shadow: var(--shadow); background: #bfe6f6; touch-action: none; }
  #scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #scene.drawing { cursor: crosshair; }

  /* 임무 카드 */
  .mission { position: absolute; top: 14px; left: 14px; width: 380px; background: rgba(255,255,255,.95); border-radius: 18px; padding: 12px 16px 14px;
             box-shadow: var(--shadow); transition: transform .4s, opacity .4s; }
  .mission .head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .mission .avatar { width: 40px; height: 40px; border-radius: 50%; background: #fff4e6; display: grid; place-items: center; flex: none; border: 2px solid #ffd9a8; }
  .mission .chap { font-size: 12px; font-weight: 700; color: var(--violet); }
  .mission h2 { margin: 0; font-size: 22px; line-height: 1.15; color: var(--ink); }
  .mission p { margin: 6px 0 0; font-size: 14.5px; line-height: 1.55; color: #3b4a61; }
  .mission p b { color: var(--coral-d); }
  .mission .chips { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; padding: 3px 10px 3px 4px; border-radius: 999px; background: #f1f4f8; color: #8a96a8; transition: all .3s; }
  .chip svg { width: 22px; height: 22px; }
  .chip.ok { background: #e3f6ec; color: #1d8a54; }
  .chip.ok::after { content: "✓"; margin-left: 2px; }
  .legend-ring { display: inline-block; width: 14px; height: 8px; border-radius: 50%; border: 2.5px solid; vertical-align: 0; margin: 0 3px 0 6px; }

  /* 하단 조작줄 */
  .hud { position: absolute; left: 14px; right: 14px; bottom: 12px; display: flex; align-items: center; gap: 10px; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  .gen-badge { background: rgba(255,255,255,.95); border-radius: 16px; padding: 6px 14px; box-shadow: var(--shadow); text-align: center; min-width: 96px; }
  .gen-badge small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
  .gen-badge b { font-family: var(--display); font-weight: 400; font-size: 26px; line-height: 1; color: var(--ink); }
  .hud .grow { flex: 1; display: flex; justify-content: center; gap: 10px; }
  .btn { font-family: var(--display); font-weight: 400; font-size: 19px; border-radius: 16px; padding: 10px 22px; min-height: 50px; border: 0;
         background: #fff; color: var(--ink); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s, opacity .2s; }
  .btn:hover:not(:disabled) { transform: translateY(-2px); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn.primary { background: linear-gradient(180deg, #ff8a6b, var(--coral-d)); color: #fff; box-shadow: 0 6px 0 #c9472c, var(--shadow); }
  .btn.primary:active:not(:disabled) { box-shadow: 0 3px 0 #c9472c; }
  .btn.teal { background: linear-gradient(180deg, #2bbcb0, #128a80); color: #fff; box-shadow: 0 6px 0 #0d6c64, var(--shadow); }
  .btn.pulse { animation: pulse 1.6s infinite; }
  @keyframes pulse { 0%,100% { filter: none; } 50% { filter: brightness(1.12) drop-shadow(0 0 10px rgba(255,118,87,.6)); } }
  .speed { display: flex; background: rgba(255,255,255,.95); border-radius: 14px; padding: 4px; box-shadow: var(--shadow); }
  .speed button { border: 0; min-height: 38px; padding: 4px 12px; border-radius: 10px; font-size: 14px; background: transparent; color: var(--muted); }
  .speed button[aria-pressed=true] { background: var(--ink); color: #fff; }
  .hidden { display: none !important; }

  /* 장면 위 팝업 */
  .modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(24, 36, 56, .38); opacity: 0; pointer-events: none; transition: opacity .35s; }
  .modal.show { opacity: 1; pointer-events: auto; }
  .card { background: #fff; border-radius: 22px; padding: 22px 26px; width: 600px; max-width: calc(100% - 40px); box-shadow: 0 20px 50px rgba(20,30,50,.25);
          transform: translateY(14px) scale(.98); transition: transform .35s; }
  .modal.show .card { transform: none; }
  .card h3 { margin: 0 0 6px; font-size: 27px; color: var(--ink); }
  .card .sub { margin: 0 0 14px; color: #4a5870; font-size: 15px; line-height: 1.55; }
  .card .actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; }
  .pick-row { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px dashed var(--line); }
  .pick-row .lab { font-family: var(--display); font-size: 18px; }
  .pick-row .lab small { display: block; font-family: var(--font); font-size: 12px; color: var(--muted); }
  .picks { display: flex; gap: 8px; }
  .pick { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 6px; border-radius: 14px; border: 2px solid var(--line);
          background: #fafbfd; font-size: 14px; font-weight: 600; min-height: 0; }
  .pick svg { width: 46px; height: 40px; }
  .pick[aria-pressed=true] { border-color: var(--coral); background: #fff3ef; color: var(--coral-d); }
  .result-row { display: grid; grid-template-columns: 120px 1fr 1fr 40px; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 14px; background: #f6f8fb; margin-bottom: 8px; font-size: 15px; }
  .result-row .lab { font-family: var(--display); font-size: 18px; }
  .result-row .mark { font-family: var(--display); font-size: 26px; text-align: center; }
  .result-row .mark.o { color: #1d9a5c; } .result-row .mark.x { color: #d0573c; }
  .flow { display: flex; align-items: stretch; gap: 6px; margin: 10px 0 4px; }
  .flow div { flex: 1; background: #f4f0fd; border-radius: 12px; padding: 8px 6px; font-size: 13px; text-align: center; line-height: 1.35; color: #3e2e6b; }
  .flow div b { display: block; font-family: var(--display); font-weight: 400; font-size: 16px; white-space: nowrap; color: var(--violet); }
  .flow i { align-self: center; color: #b9a3ea; font-style: normal; font-weight: 700; }

  .timelapse { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(40,30,80,.55), rgba(15,12,35,.85));
               color: #fff; text-align: center; opacity: 0; pointer-events: none; transition: opacity .8s; }
  .timelapse.show { opacity: 1; pointer-events: auto; }
  .timelapse b { display: block; font-family: var(--display); font-weight: 400; font-size: 64px; letter-spacing: 1px; }
  .timelapse span { font-size: 18px; opacity: .85; }
  .stamp { position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%) rotate(-12deg) scale(2.2); opacity: 0;
           font-family: var(--display); font-size: 96px; color: #d33a2c; border: 8px solid #d33a2c; border-radius: 22px; padding: 0 30px;
           background: rgba(255,255,255,.75); pointer-events: none; white-space: nowrap; transition: transform .35s cubic-bezier(.3,1.6,.5,1), opacity .2s; }
  .stamp.show { opacity: 1; transform: translate(-50%,-50%) rotate(-12deg) scale(1); }
  .stamp.show.mini { left: 84%; top: 17%; transform: translate(-50%,-50%) rotate(-12deg) scale(.55); transition: all .5s ease; }

  .bubble { position: absolute; transform: translate(-50%, -100%); background: #fff; border-radius: 14px; padding: 7px 12px; font-size: 14px; font-weight: 600;
            box-shadow: 0 6px 18px rgba(20,30,50,.2); white-space: nowrap; pointer-events: none; animation: bub .25s ease; color: var(--ink); }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-top-color: #fff; border-bottom: 0; }
  @keyframes bub { from { opacity: 0; transform: translate(-50%, -80%); } }
  .draw-hint { position: absolute; left: 50%; top: 38%; transform: translateX(-50%); pointer-events: none; text-align: center; color: #fff;
               font-family: var(--display); font-size: 22px; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .draw-hint .finger { width: 54px; height: 54px; margin: 0 auto 4px; border-radius: 50%; background: rgba(255,255,255,.85); border: 3px solid #fff;
                       box-shadow: 0 0 0 6px rgba(255,255,255,.35); animation: swipe 2s ease-in-out infinite; }
  @keyframes swipe { 0% { transform: translateY(-40px); opacity: 0; } 15% { opacity: 1; } 80% { transform: translateY(150px); opacity: 1; } 100% { transform: translateY(170px); opacity: 0; } }

  /* ---------- 옆 패널 ---------- */
  aside.side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .side-card { background: #fff; border-radius: 18px; padding: 10px 14px 10px; box-shadow: var(--shadow); min-height: 0; }
  .grp { flex: 1; display: flex; flex-direction: column; }
  .grp .gh { display: flex; align-items: center; gap: 8px; }
  .grp .gh .hab { width: 26px; height: 26px; border-radius: 8px; flex: none; }
  .grp .gh h4 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 19px; }
  .grp .gh .tot { margin-left: auto; font-size: 13px; color: var(--muted); font-weight: 600; }
  .grp .gh .tot b { font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
  .picto { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; margin: 6px 0 2px; }
  .picto.wide { grid-template-columns: repeat(12, 1fr); }
  .picto svg { width: 100%; height: 26px; transition: transform .3s; }
  .picto svg.new { animation: popIn .4s ease; }
  @keyframes popIn { from { transform: scale(.2); } }
  .counts { display: flex; gap: 10px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .counts span b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .counts i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1px solid #8f98a6; margin-right: 3px; vertical-align: -1px; }
  .chart-box { position: relative; flex: 1; min-height: 70px; margin-top: 4px; }
  .chart-box canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }
  .placeholder { flex: 1; display: grid; place-items: center; text-align: center; color: #9aa6b8; font-size: 14px; border: 2px dashed var(--line); border-radius: 14px; margin-top: 6px; }
  .pred h4 { margin: 0 0 6px; font-family: var(--display); font-weight: 400; font-size: 18px; }
  .pred-row { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 3px 0; }
  .pred-row .nm { width: 92px; color: var(--muted); font-weight: 600; }
  .pred-row .val { font-weight: 700; }
  .pred-row .res { margin-left: auto; font-family: var(--display); font-size: 18px; }
  .sim-locked .btn, .sim-locked .top-btns button { opacity: .5; pointer-events: none; }

  /* ---------- 장면 요소 ---------- */
  .rb { transition-property: transform, opacity; transition-timing-function: ease-in-out; }
  .rb .hop { animation: none; }
  .rb.moving .hop { animation: hop .32s ease-in-out infinite; }
  @keyframes hop { 0%,100% { transform: translateY(0); } 45% { transform: translateY(-13px); } }
  .rb .face { transition: transform .25s; }
  .rb.click { cursor: pointer; }
  .rb .ring { fill: none; stroke-width: 3; opacity: 0; transition: opacity .6s; }
  .show-rings .rb .ring { opacity: .95; }
  .rb .sel { fill: rgba(255,214,90,.45); stroke: #ffbf2e; stroke-width: 3; opacity: 0; transition: opacity .2s; }
  .rb.selected .sel { opacity: 1; }
  .rb.bounce .hop { animation: hop .32s ease-in-out 2; }
  .cloud { animation: drift linear infinite; }
  @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1260px); } }
  .flow-line { animation: flow 1.6s linear infinite; }
  @keyframes flow { to { stroke-dashoffset: -80; } }
  .wing { transform-box: fill-box; transform-origin: 100% 50%; animation: flap .32s ease-in-out infinite alternate; }
  @keyframes flap { from { transform: scaleY(1); } to { transform: scaleY(.45); } }
  .hawk { transition-property: transform; transition-timing-function: ease-in-out; }
  .hshadow { transition-property: transform, opacity; transition-timing-function: ease-out; }
  .deco { transition: opacity 1.2s; }
  .float-up { animation: floatUp 1.1s ease-out forwards; }
  @keyframes floatUp { from { transform: translateY(0) scale(.4); opacity: 0; } 25% { opacity: 1; transform: translateY(-10px) scale(1.1); } to { transform: translateY(-46px) scale(1); opacity: 0; } }
  .float-stay { animation: floatStay 1.8s ease-out forwards; }
  @keyframes floatStay { from { transform: scale(.3); opacity: 0; } 20% { transform: scale(1.15); opacity: 1; } 80% { opacity: 1; transform: scale(1); } to { opacity: 0; } }
</style>
</head>
<body>
<!-- 공용 그림(토끼·아이콘) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>

<header class="top">
  <div class="brand">
    <span class="badge">과학1 Ⅱ-2</span>
    <h1 class="display">토끼 무리의 대모험</h1>
    <small>변이와 생물의 다양성</small>
  </div>
  <ol class="steps" id="steps"></ol>
  <div class="top-btns">
    <button id="bChallenge" disabled title="변이가 없다면? — 본 실험에서 10세대를 관찰하면 열려요">도전 실험</button>
    <button id="bReset">처음부터</button>
  </div>
</header>

<main class="stage-main">
  <section class="scene-wrap" id="wrap">
    <svg id="scene" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid slice" aria-label="토끼가 사는 서식지">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd3f4"/><stop offset="1" stop-color="#d9f3fb"/></linearGradient>
        <linearGradient id="mtnFar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9cc9d8"/><stop offset="1" stop-color="#bfe2e6"/></linearGradient>
        <linearGradient id="mtnNear" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb38f"/><stop offset="1" stop-color="#93cc9e"/></linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ed36f"/><stop offset="1" stop-color="#6fbb4f"/></linearGradient>
        <linearGradient id="sandG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ecd9a7"/><stop offset="1" stop-color="#d9bb7c"/></linearGradient>
        <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4fb7e3"/><stop offset=".5" stop-color="#86d8f2"/><stop offset="1" stop-color="#4fb7e3"/></linearGradient>
        <radialGradient id="sunG"><stop offset="0" stop-color="#fff6c9"/><stop offset=".45" stop-color="#ffe680"/><stop offset="1" stop-color="#ffe680" stop-opacity="0"/></radialGradient>
        <clipPath id="clipRight"><path id="clipRightPath" d="M2000,0 Z"/></clipPath>
      </defs>
      <!-- 하늘 -->
      <rect width="1000" height="700" fill="url(#sky)"/>
      <circle cx="820" cy="80" r="90" fill="url(#sunG)"/>
      <circle cx="820" cy="80" r="34" fill="#fff3b0"/>
      <g id="clouds" fill="#fff" opacity=".9"></g>
      <!-- 산 -->
      <path d="M0,250 C70,190 140,170 220,215 C290,160 360,130 450,200 C520,150 600,140 690,205 C770,160 860,150 1000,210 L1000,320 L0,320 Z" fill="url(#mtnFar)"/>
      <path d="M0,282 C110,230 210,240 300,268 C420,225 520,232 640,262 C760,230 880,236 1000,258 L1000,330 L0,330 Z" fill="url(#mtnNear)"/>
      <g id="treeline"></g>
      <!-- 땅 -->
      <path d="M0,300 C220,286 420,296 620,290 C800,285 900,294 1000,290 L1000,700 L0,700 Z" fill="url(#grass)"/>
      <g id="grassStripes" fill="#b3df86" opacity=".55"></g>
      <g id="sandLayer" class="deco" opacity="0" clip-path="url(#clipRight)">
        <rect x="0" y="282" width="1000" height="420" fill="url(#sandG)"/>
        <g id="sandStripes" fill="#f3e3b9" opacity=".7"></g>
      </g>
      <g id="decoGrass"></g>
      <g id="decoSand" class="deco" opacity="0"></g>
      <!-- 강 -->
      <g id="river" opacity="0">
        <path id="rBank" fill="none" stroke="#c2955f" stroke-width="96" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="rWater" fill="none" stroke="url(#water)" stroke-width="78" stroke-linecap="round" stroke-linejoin="round"/>
        <path id="rFlow" class="flow-line" fill="none" stroke="#e0f8ff" stroke-width="3" stroke-dasharray="22 58" stroke-linecap="round" opacity=".9"/>
        <path id="rFlow2" class="flow-line" fill="none" stroke="#c4f0fd" stroke-width="2" stroke-dasharray="12 68" stroke-dashoffset="30" stroke-linecap="round" opacity=".8"/>
      </g>
      <path id="trail" fill="none" stroke="#5cc3ef" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
      <g id="shadows"></g>
      <g id="rabbits"></g>
      <g id="fx"></g>
      <g id="hawks"></g>
    </svg>

    <div class="mission" id="mission">
      <div class="head">
        <div class="avatar"><svg width="30" height="30" viewBox="0 0 40 40"><use href="#mini-white"/></svg></div>
        <div><div class="chap" id="mChap">장면 1</div><h2 class="display" id="mTitle"></h2></div>
      </div>
      <p id="mText"></p>
      <div class="chips" id="mChips"></div>
    </div>

    <div class="draw-hint hidden" id="drawHint"><div class="finger"></div>위에서 아래로 쓱— 그어 보세요</div>

    <div class="hud">
      <div class="gen-badge" id="genBadge"><small>강이 생긴 뒤</small><b id="genOut">0세대</b></div>
      <div class="grow" id="hudBtns"></div>
      <div class="speed" id="speed">
        <button data-sp="1" aria-pressed="true">보통</button>
        <button data-sp="0.35" aria-pressed="false">빠르게</button>
      </div>
    </div>

    <div class="modal" id="modal"><div class="card" id="card"></div></div>
    <div class="timelapse" id="timelapse"><div><b id="tlYear">0년</b><span>아주 오랜 시간이 흘렀어요…</span></div></div>
    <div class="stamp" id="stamp">멸종</div>
  </section>

  <aside class="side">
    <div class="side-card grp" id="cardL">
      <div class="gh"><span class="hab" id="habL"></span><h4 id="nameL">처음 무리</h4><span class="tot"><b id="totL">24</b> 마리</span></div>
      <div class="picto" id="pictoL"></div>

  async function generation(tok) {
    var caught = { L: [], R: [] }, surv = { L: [], R: [] };

    setStep(3);
    await Promise.all([hunt('L', shuffle(caught.L), tok), hunt('R', shuffle(caught.R), tok)]);
    if (tok !== token) return;
    await sleep(T(250));
    setStep(4);
    // 살아남은 토끼마다 같은 털색 자손 1마리
    var births = [];
    ['L', 'R'].forEach(function (side) {
      var parents = surv[side].filter(function (r) { return !r.gone; });
      var all = parents.map(function (p) { return { parent: p }; }).concat(parents.map(function (p) { return { old: p }; }));
      shuffle(all);
      var dropped = all.splice(CAP);   // 먹이·공간 한계: 16마리까지만
      dropped.forEach(function (o) { if (o.old) removeRabbit(o.old, T(500)); });
      all.forEach(function (o) { if (o.parent) births.push({ side: side, p: o.parent }); });
    });
    births.forEach(function (b, i) {
      setTimeout(function () {
        if (tok !== token) return;
        var p = b.p;
        fxIcon('heart', p.x, p.y - 70 * depth(p.y), 'float-up', 24);
        var r = makeRabbit(p.color, b.side, { x: p.x, y: p.y });
        r.origin = b.side;

  }

        var other = s === 'L' ? 'R' : 'L';
        var mine = pop.filter(function (r) { return r.color === c && r.side === s; });
        var need = Math.min(3, Math.floor(pop.filter(function (r) { return r.color === c; }).length / 2));
        while (mine.length < need) {
          var cand = pop.filter(function (r) { return r.color === c && r.side === other; })
            .sort(function (a, b) { return Math.abs(a.x - riverX(a.y)) - Math.abs(b.x - riverX(b.y)); })[0];
          if (!cand) break;
          cand.side = s; mine.push(cand);
        }
      });
    });
    pop.forEach(function (r) { r.origin = r.side; });
    await sleep(500);
    if (tok !== token) return;
    // 강물에 닿은 토끼는 자기 쪽으로 깡충
    pop.forEach(function (r, i) {
      if (!inArea(r.side, r.x, r.y)) {
        var p = spot(r.side, r, 160);
        setTimeout(function () { moveTo(r, p.x, p.y, 900); }, i * 25);
      }
    });
    await sleep(1400);
    if (tok !== token) return;
    snapshot();
    S.busy = false;
    if (S.mode === 'var') {
      mission('장면 2', '서식지가 나뉘어요',
        '강 왼쪽은 <b>초록 풀밭</b>, 오른쪽은 <b>모래가 많은 마른 땅</b>이 되었어요. 두 무리는 이제 서로 만날 수 없어요.');
      hud([{ label: '다음 장면 ▶', cls: 'primary pulse', go: showPredict }]);
    }
    renderAll(); push();
  }

  // ---- 예측 ----
  function openModal(html) { $('card').innerHTML = html; $('modal').classList.add('show'); }
  function closeModal() { $('modal').classList.remove('show'); }
  function showPredict() {
    var tmp = { L: S.predict.L, R: S.predict.R };
    function row(s, name, hab) {
      return '<div class="pick-row"><div class="lab">' + name + '<small>' + hab + '</small></div><div class="picks">' +
        COLORS.map(function (c) { return '<button class="pick" data-s="' + s + '" data-c="' + c + '" aria-pressed="' + (tmp[s] === c) + '">' +
          '<svg viewBox="0 8 96 90"><use href="#rab-' + c + '" width="96" height="96"/></svg>' + NAME[c] + '</button>'; }).join('') + '</div></div>';
    }
    openModal('<h3 class="display">예측해 보세요!</h3><p class="sub">곧 천적인 <b>매</b>가 나타나 토끼를 사냥해요. 여러 세대가 지나면 각 무리에서 <b>어떤 털색의 토끼가 가장 많아질까요?</b></p>' +
      row('L', '풀밭 무리', '강 왼쪽 · 초록 풀밭') + row('R', '마른 땅 무리', '강 오른쪽 · 모래 땅') +
      '<div class="actions"><button class="btn primary" id="goHunt" disabled>매가 나타나요! ▶</button></div>');
    $('card').querySelectorAll('.pick').forEach(function (b) {
      b.onclick = function () {
        tmp[b.dataset.s] = b.dataset.c;
        $('card').querySelectorAll('.pick[data-s="' + b.dataset.s + '"]').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
        $('goHunt').disabled = !(tmp.L && tmp.R);
      };
    });
    $('goHunt').onclick = function () { S.predict = tmp; closeModal(); renderPred(); push(); scene3(); };
  }

  // ---- 장면 3·4: 세대 진행 ----
  function scene3() {
    setStep(3);
    mission('장면 3 · 4', '천적과 생존, 그리고 자손',
      '매는 <b>눈에 잘 띄는 토끼</b>를 더 쉽게 잡아요. 살아남은 토끼는 <b>자신과 같은 털색의 자손</b>을 남겨요. 10세대 동안 지켜보세요.');
    hud([
      { label: function () { return S.playing ? '⏸ 멈춤' : '▶ 자동 진행'; }, cls: 'primary', show: function () { return !S.merged; },
        enabled: function () { return pop.length > 0 && (S.playing || !S.busy); },
        go: function () { if (S.playing) { S.playing = false; renderHud(); } else play(false, token); } },
      { label: '1세대만', show: function () { return !S.merged; }, enabled: function () { return !S.busy && pop.length > 0; }, go: function () { play(true, token); } },
      { label: '다음 장면 ▶', cls: 'teal', show: function () { return S.gen >= GOAL && !S.merged; }, enabled: function () { return !S.busy; }, go: scene5 }
    ]);
    renderAll(); push();
  }
  function showResults() {
    var L = count('L'), R = count('R'), tl = topColor(L), tr = topColor(R);
    S.lastVar = { left: L, right: R };
    function row(name, top, pred) {
      var ok = top === pred;
      return '<div class="result-row"><span class="lab">' + name + '</span><span>가장 많아진 털색<br><b>' + miniSvg(top, 'width="22" height="22" style="vertical-align:-6px"') + ' ' + NAME[top] + '</b></span>' +
        '<span>내 예측<br><b>' + NAME[pred] + '</b></span><span class="mark ' + (ok ? 'o' : 'x') + '">' + (ok ? '⭕' : '✖') + '</span></div>';
    }
    openModal('<h3 class="display">' + GOAL + '세대가 지났어요!</h3><p class="sub">각 무리의 털색이 어떻게 달라졌는지 예측과 비교해 보세요.</p>' +
      row('풀밭 무리', tl, S.predict.L) + row('마른 땅 무리', tr, S.predict.R) +
      '<p class="sub" style="margin-top:10px">옆의 그래프에서 어떤 털색이 늘고 어떤 털색이 줄었는지도 확인해 보세요. 왜 두 무리의 결과가 다를까요?</p>' +
      '<div class="actions"><button class="btn" id="more">세대 더 진행하기</button><button class="btn teal" id="next">다음 장면 ▶</button></div>');
    $('more').onclick = closeModal;
    $('next').onclick = function () { closeModal(); scene5(); };
    renderPred();
  }

  // ---- 장면 5: 다시 만남 ----
  async function scene5() {
    var tok = token;
    S.busy = true; S.playing = false; renderHud();
    S.lastVar = { left: count('L'), right: count('R') }; S.lastVarGen = S.gen;
    $('timelapse').classList.add('show');
    var years = [100, 1000, 5000, 10000, 50000, 100000];
    for (var i = 0; i < years.length; i++) { $('tlYear').textContent = years[i].toLocaleString('ko-KR') + '년'; await sleep(260); }
    $('tlYear').textContent = '아주 오랜 시간 뒤';
    hideRiver();
    S.merged = true; setStep(5);
    pop.forEach(function (r) { r.side = r.origin; var p = spot(null); r.x = p.x; r.y = p.y; applyPos(r, 0); });
    sortSoon();
    await sleep(900);
    if (tok !== token) return;
    $('timelapse').classList.remove('show');
    $('scene').classList.add('show-rings');
    S.busy = false;
    mission('장면 5', '서로 다른 종류가 되었을까?',
      '강이 사라져 두 무리가 다시 만났어요. 토끼 <b>두 마리를 차례로 눌러</b> 짝을 지어 보세요.<br>' +
      '<span class="legend-ring" style="border-color:#2b7bd6"></span>풀밭 무리 출신<span class="legend-ring" style="border-color:#ef8a2b"></span>마른 땅 무리 출신',
      '<span class="chip" id="chipSame">같은 무리끼리</span><span class="chip" id="chipCross">다른 무리끼리</span>');
    hud([]);
    renderAll(); push();
  }
  function pairTap(r) {
    if (S.busy) return;
    if (!selected) { selected = r; r.hold = true; r.el.classList.add('selected'); return; }
    if (selected === r) { r.el.classList.remove('selected'); r.hold = false; selected = null; return; }
    var a = selected, b = r; selected = null;
    b.hold = true; b.el.classList.add('selected');
    S.busy = true;
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    mx = Math.max(X0 + 40, Math.min(X1 - 40, mx)); my = Math.max(Y0, Math.min(Y1, my));
    moveTo(a, mx - 34, my, 650); moveTo(b, mx + 34, my, 650);
    a.dir = 1; b.dir = -1;
    setTimeout(function () {
      applyPos(a, 0); applyPos(b, 0);
      var same = a.origin === b.origin;
      fxIcon(same ? 'heart' : 'heartBroken', mx, my - 95 * depth(my), 'float-stay', 46);
      bubble(mx, my - 125 * depth(my), same ? '같은 무리 출신: 자손을 남길 수 있어요' : '다른 무리 출신: 자손을 남기지 못해요', 2200);
      if (same) { S.same = true; $('chipSame') && $('chipSame').classList.add('ok'); }
      else { S.cross = true; $('chipCross') && $('chipCross').classList.add('ok'); }
      setTimeout(function () {
        [a, b].forEach(function (x) { x.el.classList.remove('selected'); x.hold = false; });
        S.busy = false; push();
        if (S.cross && S.same && !S.mainDone) { S.mainDone = true; renderHud(); setTimeout(showSummary, 600); }
      }, 1500);
    }, 700);
  }
  function showSummary() {
    openModal('<h3 class="display">한 종류의 토끼가 서로 다른 두 종류가 되었어요!</h3>' +
      '<p class="sub">두 무리는 다시 만나도 서로 짝짓기하여 자손을 남기지 못해요. 오랜 시간 동안 각 서식지에서 일어난 변화가 쌓였기 때문이에요.</p>' +
      '<div class="flow"><div><b>변이</b>한 종류 안에 다양한 털색</div><i>›</i><div><b>서식지 나뉨</b>강이 생겨 두 무리로</div><i>›</i>' +
      '<div><b>생존</b>환경에 유리한 변이를 가진 토끼가 살아남음</div><i>›</i><div><b>자손</b>특성을 자손에게 전달, 오랜 시간 누적</div><i>›</i><div><b>다른 종류</b>생물 다양성</div></div>' +
      '<div class="actions"><button class="btn" id="close">장면 둘러보기</button><button class="btn primary" id="ch">도전 실험: 변이가 없다면? ▶</button></div>');
    $('close').onclick = closeModal;
    $('ch').onclick = function () { closeModal(); challenge(); };
  }

  // ---- 도전 실험: 변이가 없다면? ----
  function challenge() {
    clearScene();
    S.mode = 'none'; setStep(1);
    for (var i = 0; i < 24; i++) makeRabbit('white', null, spot(null));
    sortSoon();
    mission('도전 실험', '변이가 없다면?',
      '이번에는 <b>모든 토끼의 털색이 흰색으로 똑같아요.</b> 앞의 실험과 같은 강과 매를 만나면 어떻게 될까요?');
    hud([{ label: '실험 시작 ▶', cls: 'primary pulse', go: runChallenge }]);
    renderAll(); push();
  }
  async function runChallenge() {
    var tok = token;
    hud([]);
    S.speed = 0.5; syncSpeed();
    setStep(2);
    await makeRiver(DEFAULT_RIVER.map(function (p) { return p.slice(); }));
    if (tok !== token) return;
    mission('도전 실험', '변이가 없다면?', '매가 나타났어요. 흰 토끼는 풀밭에서도, 마른 땅에서도 눈에 잘 띄어요…');
    await sleep(600);
    await play(false, tok);
  }
  function finishNoVar() {
    S.noVarTried = true; S.noVarSurv = pop.length;
    var n = pop.length;
    if (n === 0) $('stamp').classList.add('show');
    setTimeout(function () {
      $('stamp').classList.add('mini');
      openModal('<h3 class="display">' + (n === 0 ? '토끼 무리가 모두 사라졌어요' : '토끼가 ' + n + '마리밖에 남지 않았어요') + '</h3>' +
        '<p class="sub">모든 토끼의 털색이 같아서 <b>바뀐 환경에서 살아남기에 유리한 토끼가 없었어요.</b> ' +
        '변이가 다양하면 환경이 급격하게 변하거나 전염병이 유행해도 그 변화에 적응할 수 있는 생물이 있어 <b>멸종할 확률이 낮아져요.</b></p>' +
        '<div class="actions"><button class="btn" id="close2">결과 보기</button><button class="btn primary" id="again">처음 실험으로 ▶</button></div>');
      $('close2').onclick = closeModal;
      $('again').onclick = function () { S.speed = 1; syncSpeed(); scene1(); };
    }, n === 0 ? 1400 : 300);
    mission('도전 실험', '변이가 없다면?', n === 0 ? '<b>멸종</b>: 환경에 적응할 수 있는 변이가 없었어요.' : '무리가 크게 줄었어요. 처음 실험 결과와 비교해 보세요.');
    renderAll(); push();
  }

  /* ---------- 공통 버튼 ---------- */
  function syncSpeed() {
    $('speed').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(+b.dataset.sp === S.speed || (S.speed === .5 && b.dataset.sp === '0.35'))); });
  }
  $('speed').querySelectorAll('button').forEach(function (b) { b.onclick = function () { S.speed = +b.dataset.sp; syncSpeed(); }; });
  $('bReset').onclick = function () { S.speed = 1; syncSpeed(); scene1(); };
  $('bChallenge').onclick = challenge;
  window.addEventListener('resize', function () { renderCharts(); });

  scene1();
})();
</script>
</body>
</html>
