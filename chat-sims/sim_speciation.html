<!DOCTYPE html>
<!-- 단원ID: speciation · 원본의 확인 문제(정답 포함)·교사용 안내는 빼고 웹앱 문제 패널에서 서버 채점 -->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토끼의 종류가 다양해지는 과정 시뮬레이터</title>
<style>
:root{
  --bg:#f4f7f2; --panel:#ffffff; --ink:#1f2a24; --sub:#5b6b62; --line:#dde5df;
  --accent:#2f7d5b; --accent2:#e8743b; --purple:#7a3fb0; --A:#7a3fb0; --B:#e8743b;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;align-items:center;gap:16px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:18px;margin:0;font-weight:800;letter-spacing:-.3px}
header h1 small{font-weight:500;color:var(--sub);font-size:13px;margin-left:6px}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600;color:var(--sub)}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{max-width:1440px;margin:0 auto;padding:14px}
.view{display:none}.view.on{display:block}
.simwrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;align-items:start}
@media(max-width:1050px){.simwrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
#stage{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#bfe8f5}
#cv{display:block;width:100%;height:auto;aspect-ratio:1000/560}
#banner{position:absolute;left:14px;top:12px;right:14px;display:flex;gap:10px;align-items:flex-start;pointer-events:none}
#banner .cap{background:rgba(255,255,255,.92);border-radius:10px;padding:7px 12px;font-weight:700;font-size:15px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
#banner .cap b{color:var(--purple);font-size:19px;margin-right:6px}
#genBadge{margin-left:auto;background:rgba(31,42,36,.82);color:#fff;border-radius:10px;padding:6px 11px;font-size:13px;font-weight:700;white-space:nowrap}
#toast{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,.96);border-radius:14px;padding:16px 22px;font-size:18px;font-weight:800;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.2);display:none;max-width:80%}
.charts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}
@media(max-width:800px){.charts{grid-template-columns:1fr}}
.chart h4{margin:0 0 6px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.chart h4 span{font-weight:500;color:var(--sub);font-size:12px}
.chart canvas{width:100%;height:150px;display:block}
.legend{display:flex;gap:10px;font-size:12px;color:var(--sub);margin-top:5px;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid #999}
.side h3{margin:0 0 8px;font-size:16px}
.side p{margin:6px 0;line-height:1.6;font-size:14.5px}
.steps{display:flex;gap:6px;margin-bottom:10px}
.steps button{flex:1;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 0;font-weight:800;color:var(--sub);cursor:pointer}
.steps button.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.steps button.done{background:#efe6f7;color:var(--purple)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;background:var(--accent);color:#fff;font-weight:700;font-size:14px;padding:9px 14px;border-radius:9px;cursor:pointer;font-family:inherit}
.btn.sec{background:#eef3ef;color:var(--ink);border:1px solid var(--line)}
.btn.warn{background:#c2493d}
.btn.orange{background:var(--accent2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.row .btn{flex:1}
.q{background:#fff5ec;border:1px solid #f6d6bd;border-radius:10px;padding:9px 11px;font-size:14px;margin:8px 0;line-height:1.55}
.box{background:#f6f9f7;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13.5px;margin:8px 0;line-height:1.6}
.ctl{margin:10px 0}
.ctl label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;margin-bottom:4px}
.ctl label span{font-weight:600;color:var(--accent)}
.ctl input[type=range]{width:100%}
select{font-family:inherit;font-size:14px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pred{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:14px;margin:8px 0}
.pred .opts{display:flex;gap:4px}
.pred .opts label{flex:1;border:1px solid var(--line);border-radius:8px;text-align:center;padding:5px 0;cursor:pointer;font-size:13px}
.pred input{display:none}
.pred input:checked+label{background:var(--accent);color:#fff;border-color:var(--accent)}
table.res{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
table.res th,table.res td{border:1px solid var(--line);padding:4px 5px;text-align:center}
table.res th{background:#f0f4f1}
.verdict{border-radius:10px;padding:10px 12px;font-weight:800;margin:8px 0;font-size:15px;line-height:1.5}
.verdict.diff{background:#f1e8fa;color:#5a2690;border:1px solid #d8c3ee}
.verdict.mid{background:#fff4e0;color:#8a5a00;border:1px solid #f1d9a8}
.verdict.same{background:#e6f4ec;color:#1d6b46;border:1px solid #bfe1cd}
hr{border:none;border-top:1px solid var(--line);margin:12px 0}
.small{font-size:12.5px;color:var(--sub);line-height:1.55}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px;margin:6px 0}
/* quiz */
.quiz{max-width:820px;margin:0 auto}
.qitem{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.qitem h4{margin:0 0 10px;font-size:16px;line-height:1.5}
.qitem .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;margin:6px 0;cursor:pointer;font-size:14.5px;font-family:inherit}
.qitem .opt.right{background:#e3f4ea;border-color:#62b38a}
.qitem .opt.wrong{background:#fbe6e3;border-color:#d77e70}
.qitem .exp{display:none;margin-top:8px;font-size:14px;background:#f6f9f7;border-radius:9px;padding:9px 12px;line-height:1.6}
#score{font-weight:800;font-size:17px;text-align:center;margin:10px 0}
/* sheet */
.sheetbar{max-width:820px;margin:0 auto 10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#sheet{max-width:820px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:6px;padding:34px 40px;font-size:14.5px;line-height:1.7}
#sheet h2{text-align:center;margin:0 0 4px;font-size:22px}
#sheet .meta{display:flex;justify-content:flex-end;gap:18px;margin:10px 0 16px}
#sheet .meta span{border-bottom:1px solid #555;min-width:110px;display:inline-block}
#sheet h3{font-size:16px;margin:20px 0 8px;border-left:4px solid var(--accent);padding-left:8px}
#sheet table{width:100%;border-collapse:collapse;margin:6px 0}
#sheet td,#sheet th{border:1px solid #888;padding:6px;text-align:center;height:30px}
#sheet th{background:#eef3ef}
.lines div{border-bottom:1px solid #aaa;height:30px}
@media print{
  header,.sheetbar,#v-sim,#v-quiz,#v-guide{display:none!important}
  body{background:#fff}
  main{padding:0}
  #v-sheet{display:block!important}
  #sheet{border:none;padding:0;max-width:none}
}
.guide{max-width:880px;margin:0 auto}
.guide .card{margin-bottom:12px}
.guide h3{margin:0 0 8px}
.guide p,.guide li{line-height:1.7;font-size:14.5px}
</style>
</head>
<body>
<header>
  <h1>🐇 토끼의 종류가 다양해지는 과정 <small>변이 · 자연에서의 생존 · 종 분화 시뮬레이터</small></h1>
  <div class="tabs">
    <button class="tab on" data-v="sim">시뮬레이터</button>
    <button class="tab" data-v="sheet">활동지</button>
  </div>
</header>
<main>
<!-- ============ SIM ============ -->
<section id="v-sim" class="view on">
  <div class="simwrap">
    <div>
      <div id="stage">
        <canvas id="cv" width="1000" height="560"></canvas>
        <div id="banner"><div class="cap" id="cap"></div><div id="genBadge">0세대</div></div>
        <div id="toast"></div>
      </div>
      <div class="charts">
        <div class="card chart"><h4>왼쪽 무리 털색 비율 <span id="nL">0마리</span></h4><canvas id="chL" width="400" height="150"></canvas>
          <div class="legend"><span><i style="background:#f4f4ef"></i>흰색</span><span><i style="background:#a7aca8"></i>회색</span><span><i style="background:#97714f"></i>갈색</span></div></div>
        <div class="card chart"><h4>오른쪽 무리 털색 비율 <span id="nR">0마리</span></h4><canvas id="chR" width="400" height="150"></canvas>
          <div class="legend"><span>가로축: 세대 · 세로축: 비율(%)</span></div></div>
        <div class="card chart"><h4>짝짓기 시기 분포 <span id="compat">-</span></h4><canvas id="chS" width="400" height="150"></canvas>
          <div class="legend"><span><i style="background:var(--A)"></i>왼쪽 무리</span><span><i style="background:var(--B)"></i>오른쪽 무리</span></div></div>
      </div>
    </div>
    <div class="card side">
      <div class="tabs" style="margin:0 0 12px;justify-content:stretch">
        <button class="tab on" id="mStory" style="flex:1">이야기 모드</button>
        <button class="tab" id="mFree" style="flex:1">자유 실험</button>
      </div>
      <div id="storyPanel"></div>
      <div id="freePanel" style="display:none">
        <h3>실험 조건</h3>
        <div class="two">
          <div class="ctl"><label>왼쪽 서식지</label><select id="habL"></select></div>
          <div class="ctl"><label>오른쪽 서식지</label><select id="habR"></select></div>
        </div>
        <div class="ctl"><label>천적(매) 사냥 강도 <span id="hawkV"></span></label><input type="range" id="hawk" min="0" max="100" step="5"></div>
        <div class="ctl"><label>처음 무리의 털색 비율 <span id="ratioV"></span></label>
          <div class="two" style="grid-template-columns:auto 1fr;font-size:13px;align-items:center;gap:2px 8px">
            <span>흰색</span><input type="range" id="rW" min="0" max="10">
            <span>회색</span><input type="range" id="rG" min="0" max="10">
            <span>갈색</span><input type="range" id="rB" min="0" max="10">
          </div></div>
        <div class="ctl"><label>질병 저항성 변이를 가진 토끼 <span id="resV"></span></label><input type="range" id="res" min="0" max="50" step="5"></div>
        <div class="row"><button class="btn sec" id="fReset">↺ 이 조건으로 처음부터</button></div>
        <hr>
        <div class="row">
          <button class="btn" id="fRiver">🌊 강 생기기</button>
        </div>
        <div class="row">
          <button class="btn" id="f1">▶ 1세대</button>
          <button class="btn" id="f10">▶▶ 10세대</button>
          <button class="btn" id="fAuto">⏯ 자동</button>
        </div>
        <label class="chk"><input type="checkbox" id="anim" checked> 1세대 진행 때 매 사냥·번식 장면 보기</label>
        <hr>
        <h3 style="font-size:15px">갑작스러운 사건</h3>
        <div class="row">
          <button class="btn warn" id="fSnow">❄ 폭설 (환경 급변)</button>
          <button class="btn warn" id="fSick">🦠 전염병</button>
        </div>
        <p class="small">사건은 다음 세대를 진행할 때 일어납니다. 폭설이 오면 양쪽 서식지가 눈밭으로 바뀝니다(서식지는 위에서 다시 바꿀 수 있어요).</p>
        <hr>
        <div class="row"><button class="btn orange" id="fMeet">💞 두 무리 만나게 하기 (같은 종일까?)</button></div>
        <label class="chk"><input type="checkbox" id="mark"> 토끼 위에 출신 무리 표시</label>
        <div id="freeResult"></div>
      </div>
    </div>
  </div>
</section>

<!-- ============ SHEET ============ -->
<section id="v-sheet" class="view">
  <div class="sheetbar">
    <button class="btn" id="sFill">현재 실험 결과로 표 채우기</button>
    <button class="btn sec" id="sBlank">빈 활동지</button>
    <button class="btn sec" id="sPrint">🖨 인쇄</button>
    <span class="small" id="printHint">링크 화면에서 인쇄가 안 되면 내려받은 HTML 파일을 브라우저로 열어 인쇄하세요.</span>
  </div>
  <div id="sheet"></div>
</section>

</main>

<script>
"use strict";
/* ================== 설정 ================== */
const W = 1000, H = 560, GROUND_Y = 172;
const COLORS = [
  {name:'흰색', body:'#f6f6f1', stroke:'#a9a9a0', ear:'#f3a6b2'},
  {name:'회색', body:'#a9aeaa', stroke:'#666d68', ear:'#ee9fac'},
  {name:'갈색', body:'#98724f', stroke:'#5a412b', ear:'#5e4330'}
];
const HABS = [
  {name:'풀밭', vis:[0.9,0.22,0.55], opt:3.5},
  {name:'메마른 모래땅', vis:[0.85,0.55,0.2], opt:9.5},
  {name:'눈밭', vis:[0.1,0.6,0.95], opt:6.5}
];
const K_SIDE = 24, MUT = 0.02, TOL = 2.0, PULL = 0.05, NOISE = 0.33;
const S = {
  rabbits:[], gen:0, river:false, riverW:0, hab:[0,0], prevHab:[0,0], habT:[1,1],
  hawk:60, ratio:[4,3,3], res:15, busy:false, auto:false, mode:'story',
  pendingSnow:false, pendingSick:false, hist:[[],[]], seasonHist:[], groupsSet:false,
  extinct:false, snowParticles:[], effects:[], showMark:false, sickFog:0
};
let nextId = 1;
const rand = (a,b)=>a+Math.random()*(b-a);
const gauss = ()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sleep = ms=>new Promise(r=>setTimeout(r,ms));
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];

/* ================== 지형 ================== */
const riverX = y => 520 + 45*Math.sin((y-GROUND_Y)/62) + (y-GROUND_Y)*0.08;
function sideOf(x,y){return x < riverX(y) ? 0 : 1}
function randPos(side, free){
  for(let t=0;t<50;t++){
    const y = rand(222, 540);
    const rx = riverX(y);
    const gap = S.river ? S.riverW/2+26 : 12;
    let x;
    if(free) x = rand(30, 970);
    else if(side===0) x = rand(30, rx-gap);
    else x = rand(rx+gap, 970);
    if(free || !S.river) return {x,y};
    if((side===0 && x<rx-gap) || (side===1 && x>rx+gap)) return {x,y};
  }
  return {x: side===0?120:880, y:400};
}

/* 배경 장식(고정) */
const deco = (()=>{
  let seed = 7; const r=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const items=[];
  for(let i=0;i<70;i++){const y=GROUND_Y+20+r()*370;items.push({x:r()*1000,y,k:r(),s:0.6+(y-GROUND_Y)/400})}
  const trees=[];for(let i=0;i<14;i++)trees.push({x:20+r()*960,y:GROUND_Y-4+r()*14,s:0.7+r()*0.6});
  return {items,trees};
})();

/* ================== 토끼 생성 ================== */
function makeRabbit(color, season, res, side, pos, group){
  const p = pos || randPos(side, !S.river);
  return {id:nextId++, color, season, res, side: p? sideOf(p.x,p.y):side, group: group??null,
    x:p.x, y:p.y, tx:p.x, ty:p.y, dir:Math.random()<.5?-1:1, hop:0, idle:rand(0,2),
    alpha:1, scale:1, born:0, dying:false, dieAt:0, carried:false, locked:false, sick:false, fading:false};
}
function initPop(n=40){
  S.rabbits=[]; S.gen=0; S.hist=[[],[]]; S.extinct=false; S.groupsSet=false; S.effects=[];
  S.pendingSnow=S.pendingSick=false;
  const tot = S.ratio[0]+S.ratio[1]+S.ratio[2] || 1;
  for(let i=0;i<n;i++){
    let r=Math.random()*tot, c=0;
    if(r<S.ratio[0])c=0; else if(r<S.ratio[0]+S.ratio[1])c=1; else c=2;
    if(S.ratio[0]+S.ratio[1]+S.ratio[2]===0) c=1;
    const res = Math.random()*100 < S.res;
    S.rabbits.push(makeRabbit(c, 6.5+gauss()*0.4, res, null, randPos(0,true)));
  }
  if(S.river) setGroups();
  record(); hideToast(); updateUI();
}
function setGroups(){S.rabbits.forEach(r=>{r.side=sideOf(r.x,r.y); r.group=r.side}); S.groupsSet=true}

/* ================== 기록 ================== */
function alive(){return S.rabbits.filter(r=>!r.dying && !r.fading)}
function record(){
  for(let s=0;s<2;s++){
    const pop = alive().filter(r=>r.side===s);
    const c=[0,0,0]; pop.forEach(r=>c[r.color]++);
    S.hist[s].push({gen:S.gen, n:pop.length, c});
  }
}

/* ================== 세대 진행 ================== */
function huntProb(r, mult){
  const hab = HABS[S.hab[r.side]];
  return clamp(S.hawk/100 * mult * hab.vis[r.color] * 0.95, 0, 0.97);
}
async function hunt(animated){
  let mult = 1;
  if(S.pendingSnow){
    S.pendingSnow=false; S.prevHab=[...S.hab]; S.hab=[2,2]; S.habT=[0,0];
    mult = 1.5; showCap('❄','갑자기 폭설이 내려 서식지가 눈밭으로 바뀌었다! 먹이가 부족하고 천적의 눈에 띄기 쉬워졌다.');
    if(animated) for(let i=0;i<140;i++) S.snowParticles.push({x:rand(0,1000),y:rand(-560,0),v:rand(40,90),r:rand(1.5,3.5)});
    if(animated) await sleep(1200);
  }
  const sick = S.pendingSick; S.pendingSick=false;
  const pop = alive();
  const victims=[], sickV=[];
  pop.forEach(r=>{
    if(sick && Math.random() < (r.res?0.05:0.95)){ sickV.push(r); return; }
    if(Math.random() < huntProb(r,mult)) victims.push(r);
  });
  if(sick){ showCap('🦠','전염병이 돌았다! 질병 저항성 변이가 없는 토끼는 대부분 쓰러졌다.'); }
  if(!animated){
    const dead=new Set([...victims,...sickV]);
    S.rabbits = S.rabbits.filter(r=>!dead.has(r));
    return;
  }
  if(sick){
    S.sickFog=1;
    sickV.forEach((r,i)=>{r.sick=true; r.dying=true; r.dieAt=performance.now()+600+i*25});
    await sleep(1500);
  }
  if(victims.length){
    const shown = victims.slice().sort(()=>Math.random()-.5).slice(0, Math.min(3, victims.length));
    const others = victims.filter(v=>!shown.includes(v));
    const now = performance.now();
    others.forEach((r,i)=>{r.dying=true; r.dieAt=now+500+i*120; r.shadow=true});
    for(const v of shown) await hawkCatch(v);
    await sleep(Math.max(0, others.length*120+900 - shown.length*1500));
  }
  await sleep(400);
  const dead=new Set([...victims,...sickV]);
  S.rabbits = S.rabbits.filter(r=>!dead.has(r));
  S.sickFog=0;
}
function makeChild(m,f){
  const pr = Math.random()<.5?m:f;
  let color = pr.color;
  if(Math.random()<MUT){ const o=[0,1,2].filter(c=>c!==color); color=pick(o); }
  const side = m.side;
  const avg = (m.season+f.season)/2;
  const opt = HABS[S.hab[side]].opt;
  const season = clamp(avg + PULL*(opt-avg) + gauss()*NOISE*0.5, 1, 12.9);
  let res = (Math.random()<.5?m:f).res; if(Math.random()<0.005) res=!res;
  let group = m.group===f.group ? m.group : (m.group===null?f.group:(f.group===null?m.group:'H'));
  let pos;
  if(S.river){ pos = {x:clamp(m.x+rand(-40,40),30,970), y:clamp(m.y+rand(-30,30),222,540)};
    const rx=riverX(pos.y), gap=S.riverW/2+26;
    if(side===0 && pos.x>rx-gap) pos=randPos(0); if(side===1 && pos.x<rx+gap) pos=randPos(1);
  } else pos = Math.random()<.5 ? randPos(0,true) : {x:clamp(m.x+rand(-50,50),30,970), y:clamp(m.y+rand(-30,30),222,540)};
  const c = makeRabbit(color, season, res, side, pos, group);
  return c;
}
function breedPlan(){
  const pop = alive();
  const kids=[];
  const groups = S.river ? [pop.filter(r=>r.side===0), pop.filter(r=>r.side===1)] : [pop];
  const K = S.river ? K_SIDE : K_SIDE*2;
  groups.forEach(g=>{
    if(g.length<2) return;
    const target = Math.min(K, Math.round(g.length*2.4));
    let made=0, tries=0;
    while(made<target && tries<target*12){
      tries++;
      const m = pick(g);
      const cands = g.filter(o=>o!==m && Math.abs(o.season-m.season)<TOL);
      if(!cands.length) continue;
      const f = pick(cands);
      kids.push(makeChild(m,f)); made++;
    }
  });
  return kids;
}
async function breed(animated){
  const parents = alive();
  const kids = breedPlan();
  if(!animated){ S.rabbits = kids; return; }
  const now = performance.now();
  kids.forEach((k,i)=>{k.born = now + i*35; k.scale=0});
  S.rabbits.push(...kids);
  kids.slice(0,10).forEach((k,i)=>setTimeout(()=>addFx(k.x,k.y-30,'heart'),i*35));
  await sleep(kids.length*35+800);
  parents.forEach(p=>p.fading=true);
  await sleep(700);
  S.rabbits = S.rabbits.filter(r=>!parents.includes(r));
}
function afterGen(){
  S.gen++;
  S.rabbits.forEach(r=>{ if(!S.river) r.side=sideOf(r.x,r.y); });
  record();
  if(alive().length===0){ S.extinct=true; S.auto=false; showToast('💀 모든 토끼가 사라졌습니다 (멸종)<br><span style="font-size:14px;font-weight:600">변이가 다양하지 않으면 급격한 변화에 적응할 개체가 없어요.</span>'); }
  updateUI();
}
async function runGen(animated){
  if(S.extinct) return;
  await hunt(animated);
  await breed(animated);
  afterGen();
}

async function hawkCatch(r){

let last=performance.now();
function update(dt, now){
  flow+=dt;
  for(let s=0;s<2;s++) if(S.habT[s]<1) S.habT[s]=Math.min(1,S.habT[s]+dt*0.8);
  S.rabbits.forEach(r=>{
    if(r.dying && now>=r.dieAt && !r.carried) r.alpha=Math.max(0,r.alpha-dt*2.2);
    if(r.fading) r.alpha=Math.max(0,r.alpha-dt*1.6);
    if(r.locked || r.carried || r.dying) { if(r.locked && !r.carried){ moveTo(r,dt,90); } return; }
    // stay on side when river exists
    if(S.river && S.riverW>4){
      const rx=riverX(r.y), gap=S.riverW/2+20;
      const ok = r.side===0 ? r.x<rx-gap : r.x>rx+gap;
      if(!ok && Math.abs(r.tx-r.x)<3){const p=randPos(r.side);r.tx=p.x;r.ty=p.y;}
    }
    if(Math.hypot(r.tx-r.x,r.ty-r.y)<2){
      r.hop=0; r.idle-=dt;
      if(r.idle<=0){ r.idle=rand(1,4);
        const p = S.river? randPos(r.side) : (Math.random()<.85? {x:clamp(r.x+rand(-120,120),30,970),y:clamp(r.y+rand(-60,60),222,540)} : randPos(0,true));
        r.tx=p.x; r.ty=p.y; }
    } else moveTo(r,dt,45);
  });
  S.snowParticles.forEach(p=>{p.y+=p.v*dt;p.x+=Math.sin(p.y/30)*0.4});
  S.snowParticles=S.snowParticles.filter(p=>p.y<H);
}
function moveTo(r,dt,speed){
  const dx=r.tx-r.x, dy=r.ty-r.y, d=Math.hypot(dx,dy);
  if(d<2){r.hop=0;return}
  const st=Math.min(d,speed*dt);
  r.x+=dx/d*st; r.y+=dy/d*st; r.hop+=dt*9; if(Math.abs(dx)>1) r.dir=dx>0?1:-1;
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;

  if(S.sickFog){ctx.fillStyle='rgba(120,160,60,.12)';ctx.fillRect(0,0,W,H)}
  // 서식지 라벨
  ctx.save();ctx.font='bold 13px sans-serif';
  const labels = S.river||S.hab[0]!==S.hab[1] ? [[18,'왼쪽: '+HABS[S.hab[0]].name,'left'],[982,'오른쪽: '+HABS[S.hab[1]].name,'right']] : [[18,HABS[S.hab[0]].name,'left']];
  labels.forEach(([x,t,al])=>{ctx.textAlign=al;ctx.fillStyle='rgba(255,255,255,.85)';const w=ctx.measureText(t).width+14;ctx.fillRect(al==='left'?x-4:x-w+4,H-30,w,22);ctx.fillStyle='#24332b';ctx.fillText(t,al==='left'?x+3:x-3,H-14)});

const CC=['#f1f1ea','#a7aca8','#97714f'];
function drawStack(c, hist){
  const g=c.getContext('2d'); g.clearRect(0,0,400,150);
  const L=30,R=392,T=8,B=128;
  g.strokeStyle='#ccd5cf';g.lineWidth=1;g.font='10px sans-serif';g.fillStyle='#6b7a71';
  [0,50,100].forEach(p=>{const y=B-(B-T)*p/100;g.beginPath();g.moveTo(L,y);g.lineTo(R,y);g.stroke();g.fillText(p+'%',2,y+3)});
  if(!hist.length){return}
  const maxG=Math.max(10,hist[hist.length-1].gen);
  const X=gn=>L+(R-L)*gn/maxG;
  const pts=hist.map(h=>{const n=h.n||1;return{gen:h.gen,p:h.c.map(v=>v/n),n:h.n}});
  // stacked areas
  for(let k=2;k>=0;k--){
    g.beginPath();
    pts.forEach((p,i)=>{let cum=0;for(let j=0;j<=k;j++)cum+=p.p[j];if(p.n===0)cum=0;const y=B-(B-T)*cum;i?g.lineTo(X(p.gen),y):g.moveTo(X(p.gen),y)});
    for(let i=pts.length-1;i>=0;i--){const p=pts[i];let cum=0;for(let j=0;j<k;j++)cum+=p.p[j];if(p.n===0)cum=0;g.lineTo(X(p.gen),B-(B-T)*cum)}
    g.closePath();g.fillStyle=CC[k];g.fill();
    if(k===0){g.strokeStyle='#bdbdb3';g.stroke();}
  }
  // extinct marks
  pts.forEach(p=>{if(p.n===0){g.fillStyle='rgba(200,60,50,.15)';g.fillRect(X(p.gen)-1,T,2,B-T)}});
  g.fillStyle='#6b7a71';g.textAlign='center';
  const step=maxG<=20?5:maxG<=50?10:20;
  for(let i=0;i<=maxG;i+=step)g.fillText(i,X(i),B+12);
  g.textAlign='right';g.fillText('세대',R,B+22);g.textAlign='left';
}
function compatInfo(){
  const pop=alive();
  let A,B;
  if(S.groupsSet){A=pop.filter(r=>r.group===0);B=pop.filter(r=>r.group===1);}
  else {A=pop.filter(r=>r.side===0);B=pop.filter(r=>r.side===1);}
  if(!A.length||!B.length) return {A,B,p:null};
  let ok=0,n=0;
  A.forEach(a=>B.forEach(b=>{n++; if(Math.abs(a.season-b.season)<TOL) ok++;}));
  return {A,B,p:ok/n};
}
function drawSeason(){
  const g=chS.getContext('2d');g.clearRect(0,0,400,150);
  const L=10,R=392,T=8,B=118;
  const {A,B:Bb,p}=compatInfo();
  const bins=24, cnt=[new Array(bins).fill(0),new Array(bins).fill(0)];
  A.forEach(r=>cnt[0][Math.min(bins-1,Math.floor((r.season-1)/12*bins))]++);
  Bb.forEach(r=>cnt[1][Math.min(bins-1,Math.floor((r.season-1)/12*bins))]++);
  const mx=Math.max(4,...cnt[0],...cnt[1]);
  const bw=(R-L)/bins;
  g.strokeStyle='#ccd5cf';g.beginPath();g.moveTo(L,B);g.lineTo(R,B);g.stroke();
  [[0,'rgba(122,63,176,.65)'],[1,'rgba(232,116,59,.65)']].forEach(([k,col])=>{
    g.fillStyle=col;cnt[k].forEach((v,i)=>{if(!v)return;const h=(B-T)*v/mx;g.fillRect(L+i*bw+1,B-h,bw-2,h)});
  });
  g.fillStyle='#6b7a71';g.font='10px sans-serif';g.textAlign='center';
  for(let m=1;m<=12;m++)g.fillText(m+'월',L+(m-1)/12*(R-L)+bw,B+12);
  g.textAlign='left';
  const el=document.getElementById('compat');
  if(p===null) el.textContent='두 무리 간 짝짓기 가능성: -';
  else el.innerHTML='두 무리 간 짝짓기 가능성 <b style="color:'+(p<.2?'#7a3fb0':p<.7?'#b07a00':'#2f7d5b')+'">'+Math.round(p*100)+'%</b>';
}

async function meetTest(resultEl){
  pairMarks=[];
  if(S.river){ showCap('','강이 사라지고 있다…'); await setRiver(false,true); }
  S.showMark=true; document.getElementById('mark').checked=true;
  showCap('','두 무리가 한곳에서 만났다. 서로 짝짓기를 하여 자손을 남길 수 있을까?');
  // mingle
  alive().forEach(r=>{const p=randPos(0,true);r.tx=p.x;r.ty=p.y;r.idle=3});
  await sleep(2200);
  const pop=alive();
  const A=pop.filter(r=>r.group===0), B=pop.filter(r=>r.group===1);
  const pairs=[];
  const used=new Set();
  const take=(arr)=>{const f=arr.filter(r=>!used.has(r));if(!f.length)return null;const r=pick(f);used.add(r);return r};
  const plan = (A.length&&B.length) ? ['AB','AB','AB','AB','AA','BB','AB','AA'] : ['XX','XX','XX','XX','XX','XX'];
  plan.forEach(t=>{
    let a,b;
    if(t==='AB'){a=take(A);b=take(B);} else if(t==='AA'){a=take(A);b=take(A);} else if(t==='BB'){a=take(B);b=take(B);} else {a=take(pop);b=take(pop);}
    if(a&&b) pairs.push({a,b,t});
  });
  const spots=[];
  const cols=4;
  pairs.forEach((p,i)=>{const cx=150+(i%cols)*235, cy=300+Math.floor(i/cols)*160;spots.push([cx,cy])});
  pairs.forEach((p,i)=>{const [cx,cy]=spots[i];p.a.locked=true;p.b.locked=true;p.a.tx=cx-22;p.a.ty=cy;p.b.tx=cx+22;p.b.ty=cy;});
  await sleep(2300);
  pairs.forEach(p=>{p.a.dir=1;p.b.dir=-1});
  let same=[0,0],cross=[0,0];
  for(let i=0;i<pairs.length;i++){
    const p=pairs[i]; const ok=Math.abs(p.a.season-p.b.season)<TOL;
    pairMarks.push({x:spots[i][0],y:spots[i][1],ok});
    if(p.t==='AB'){cross[1]++;if(ok)cross[0]++;} else {same[1]++;if(ok)same[0]++;}
    await sleep(450);
  }
  const ci=compatInfo();
  const pct = ci.p===null?null:Math.round(ci.p*100);
  let html='<table class="res"><tr><th>짝</th><th>짝짓기 성공</th></tr>';
  if(A.length&&B.length){
    html+=`<tr><td>같은 무리끼리</td><td>${same[0]} / ${same[1]}</td></tr><tr><td>다른 무리끼리</td><td>${cross[0]} / ${cross[1]}</td></tr></table>`;
    html+=`<p class="small">전체 토끼로 계산한 두 무리 간 짝짓기 가능성: <b>${pct}%</b> · 짝짓기 시기 평균: 왼쪽 무리 ${avgSeason(A)}월, 오른쪽 무리 ${avgSeason(B)}월</p>`;
    let v;
    if(pct<20) v='<div class="verdict diff">🧬 서로 다른 종이 되었다!<br><span style="font-weight:600;font-size:13.5px">두 무리는 만나도 짝짓기하여 자손을 남기지 못합니다. 오랜 시간 따로 살며 변화가 누적되었기 때문입니다.</span></div>';
    else if(pct<70) v='<div class="verdict mid">⏳ 서로 다른 종으로 나뉘는 중<br><span style="font-weight:600;font-size:13.5px">짝짓기가 되는 경우와 안 되는 경우가 섞여 있습니다. 더 오랜 시간이 필요해요.</span></div>';
    else v='<div class="verdict same">🐇 아직 같은 종<br><span style="font-weight:600;font-size:13.5px">두 무리가 만나 자유롭게 짝짓기하여 자손을 남길 수 있습니다.</span></div>';
    html+=v;
    showCap('5', pct<20?'두 무리가 만나게 되었지만, 이미 서로 다른 종류의 토끼가 되었다.':pct<70?'두 무리 사이에 짝짓기가 되기도, 안 되기도 한다.':'두 무리가 만나 다시 함께 짝짓기를 한다 — 아직 같은 종이다.');
  } else {
    html+=`<tr><td>무작위 짝</td><td>${same[0]+cross[0]} / ${same[1]+cross[1]}</td></tr></table><div class="verdict same">한 무리만 있어 비교할 수 없습니다. 먼저 강을 만들어 무리를 나누고 여러 세대를 진행해 보세요.</div>`;
  }
  if(resultEl) resultEl.innerHTML=html;
  await sleep(3500);
  pairs.forEach(p=>{p.a.locked=false;p.b.locked=false});
  setTimeout(()=>{pairMarks=[]},4000);
  updateUI();
  return pct;
}
function avgSeason(arr){if(!arr.length)return '-';return (arr.reduce((s,r)=>s+r.season,0)/arr.length).toFixed(1)}

  $('f1').disabled=$('f10').disabled=S.busy||S.extinct;
  $('fSnow').textContent=S.pendingSnow?'❄ 폭설 예정…':'❄ 폭설 (환경 급변)';
  $('fSick').textContent=S.pendingSick?'🦠 전염병 예정…':'🦠 전염병';
}
function freeCap(){
  showCap('', S.river?'강으로 나뉜 두 무리 · 왼쪽 '+HABS[S.hab[0]].name+' / 오른쪽 '+HABS[S.hab[1]].name : '강이 없어 한 무리로 섞여 사는 토끼');
}
$('hawk').oninput=()=>{S.hawk=+$('hawk').value;updateFree()};
$('res').oninput=updateFree;
['rW','rG','rB'].forEach(id=>$(id).oninput=updateFree);
$('habL').onchange=()=>{S.prevHab[0]=S.hab[0];S.hab[0]=+$('habL').value;S.habT[0]=0;freeCap()};
$('habR').onchange=()=>{S.prevHab[1]=S.hab[1];S.hab[1]=+$('habR').value;S.habT[1]=0;freeCap()};
$('mark').onchange=()=>{S.showMark=$('mark').checked};
$('fReset').onclick=()=>{if(S.busy)return;S.auto=false;readFreeCtl();pairMarks=[];initPop(40);$('freeResult').innerHTML='';freeCap()};
$('fRiver').onclick=async()=>{if(S.busy)return;S.busy=true;updateFree();await setRiver(!S.river,true);S.busy=false;freeCap();updateUI()};
async function freeRun(n,animated){
  if(S.busy)return; S.busy=true; updateFree();
  for(let i=0;i<n && !S.extinct;i++){ await runGen(animated); if(!animated) await sleep(90); }
  S.busy=false; freeCap(); updateUI();
}
$('f1').onclick=()=>freeRun(1,$('anim').checked);
$('f10').onclick=()=>freeRun(10,false);
$('fAuto').onclick=async()=>{
  if(S.auto){S.auto=false;updateFree();return}
  if(S.busy||S.extinct)return;
  S.auto=true;S.busy=true;updateFree();
  while(S.auto && !S.extinct){await runGen(false);await sleep(220);}
  S.auto=false;S.busy=false;freeCap();updateUI();
};
$('fSnow').onclick=()=>{S.pendingSnow=true;updateFree()};
$('fSick').onclick=()=>{S.pendingSick=true;updateFree()};
$('fMeet').onclick=async()=>{if(S.busy)return;S.busy=true;updateFree();await meetTest($('freeResult'));S.busy=false;updateUI();};

/* ================== 모드 전환 ================== */
function setMode(m){
  if(S.busy) return;
  S.mode=m; S.auto=false;
  $('mStory').classList.toggle('on',m==='story'); $('mFree').classList.toggle('on',m==='free');
  $('storyPanel').style.display=m==='story'?'block':'none';
  $('freePanel').style.display=m==='free'?'block':'none';
  if(m==='free'){
    $('hawk').value=S.hawk; $('rW').value=S.ratio[0];$('rG').value=S.ratio[1];$('rB').value=S.ratio[2];$('res').value=S.res;
    $('mark').checked=S.showMark; freeCap(); updateFree();
  } else storyReset();
}
$('mStory').onclick=()=>setMode('story'); $('mFree').onclick=()=>setMode('free');
document.querySelectorAll('header .tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('header .tab').forEach(x=>x.classList.toggle('on',x===t));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t.dataset.v));
  if(t.dataset.v==='sheet' && !$('sheet').innerHTML) renderSheet(false);
});

/* ================== 활동지 ================== */
function renderSheet(fill){
  const gens=[0,10,20,30,40];
  const row=(s,g)=>{
    if(!fill) return '<td></td><td></td><td></td><td></td>';
    const h=S.hist[s].find(x=>x.gen===g);
    if(!h) return '<td></td><td></td><td></td><td></td>';
    const n=h.n||1;
    return `<td>${h.n}</td>`+h.c.map(v=>`<td>${h.n?Math.round(v/n*100):0}%</td>`).join('');
  };
  const cond = fill? `왼쪽 서식지: <b>${HABS[S.hab[0]].name}</b> · 오른쪽 서식지: <b>${HABS[S.hab[1]].name}</b> · 매 사냥 강도: <b>${S.hawk}%</b>` : '왼쪽 서식지: ________ · 오른쪽 서식지: ________ · 매 사냥 강도: ______%';
  let h=`<h2>토끼의 종류가 다양해지는 과정</h2>
  <div style="text-align:center;color:#555">Ⅱ. 생물의 구성과 다양성 · 2. 생물의 다양성 (교과서 46~47쪽)</div>
  <div class="meta">학번 <span></span> 이름 <span></span></div>
  <h3>1. 실험 조건</h3><p>${cond}</p>
  <h3>2. 예측하기</h3>
  <p>각 서식지에서 살아남기에 유리한 털색은 무엇일까? 그렇게 생각한 까닭은?</p>
  <table><tr><th style="width:22%"></th><th style="width:22%">예측한 털색</th><th>까닭</th></tr><tr><td>왼쪽 무리</td><td></td><td></td></tr><tr><td>오른쪽 무리</td><td></td><td></td></tr></table>
  <h3>3. 세대별 털색 비율 기록</h3>
  <table><tr><th rowspan="2">세대</th><th colspan="4">왼쪽 무리</th><th colspan="4">오른쪽 무리</th></tr>
  <tr><th>개체 수</th><th>흰색</th><th>회색</th><th>갈색</th><th>개체 수</th><th>흰색</th><th>회색</th><th>갈색</th></tr>
  ${gens.map(g=>`<tr><td>${g}</td>${row(0,g)}${row(1,g)}</tr>`).join('')}</table>
  <h3>4. 두 무리가 다시 만났을 때</h3>
  <p>다른 무리끼리 짝짓기 성공: ______ / ______ · 판정: (같은 종 / 다른 종으로 나뉘는 중 / 서로 다른 종)</p>
  <h3>5. 생각 정리</h3>
  <p>(1) 세대가 지날수록 각 무리의 털색 비율이 달라진 까닭을 '변이', '천적', '자손'이라는 낱말을 사용하여 설명해 보자.</p><div class="lines"><div></div><div></div><div></div></div>
  <p>(2) 두 무리가 서로 다른 종이 되었다고 판단할 수 있는 근거는 무엇인가?</p><div class="lines"><div></div><div></div></div>
  <p>(3) 같은 종류에 속하는 생물의 변이가 다양하면 어떤 점이 좋은지 자유 실험(폭설·전염병) 결과를 근거로 써 보자.</p><div class="lines"><div></div><div></div><div></div></div>`;
  $('sheet').innerHTML=h;
}
$('sFill').onclick=()=>renderSheet(true);
$('sBlank').onclick=()=>renderSheet(false);
$('sPrint').onclick=()=>{try{window.print()}catch(e){}};

/* ================== 시작 ================== */
storyReset();
</script>
</body>
</html>
