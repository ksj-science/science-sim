<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>중학교 과학 시뮬레이터</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="lib/sim.css">
<style>
  body { min-height: 100%; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 20px 48px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .lead { color: var(--muted); margin: 0 0 18px; }
  .ok { display: inline-flex; gap: 8px; align-items: center; background: #e7f6ee; color: var(--good);
        border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; margin-bottom: 22px; }
  .grade { margin: 26px 0 10px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
  a.card { display: block; text-decoration: none; color: inherit; background: var(--panel); border: 1px solid var(--line);
           border-radius: var(--radius); padding: 16px; transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card .meta { color: var(--muted); font-size: 13px; }
  .card .uid { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #eef1f5; border-radius: 5px; padding: 1px 6px; margin-right: 4px; }
  .card h3 { margin: 4px 0 6px; font-size: 17px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  .tag { display: inline-block; font-size: 12px; background: var(--accent-soft); color: var(--accent);
         border-radius: 6px; padding: 1px 8px; margin-left: 6px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>중학교 과학 시뮬레이터</h1>
  <p class="lead">교과서 차례 순서대로 정리한 수업용 시뮬레이터입니다. 크롬북에서 바로 열 수 있어요.</p>
  <div class="ok" id="status">● 사이트 연결 성공</div>
  <div id="list"><p class="hint">목록을 불러오는 중…</p></div>
  <footer>하남중학교 과학과 · 시뮬레이터는 자유롭게 수업에 쓰셔도 됩니다. · <a href="teacher.html">교사용 대시보드</a></footer>
</div>
<script>
fetch('units.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (units) {
  var names = { 0: '예시', 1: '1학년 (과학1)', 2: '2학년 (과학2)', 3: '3학년 (과학3)' };
  units = units.filter(function (u) { return u.dashboard !== false; });
  units.sort(function (a, b) { return a.grade - b.grade || roman(a.chapter) - roman(b.chapter) || String(a.chapter).localeCompare(String(b.chapter), 'ko', { numeric: true }) || (a.source === 'chat') - (b.source === 'chat') || String(a.id).localeCompare(String(b.id), 'ko', { numeric: true }); });
  var html = '', cur = null;
  units.forEach(function (u) {
    if (u.grade !== cur) { if (cur !== null) html += '</div>'; cur = u.grade; html += '<h2 class="grade">' + (names[u.grade] || u.grade + '학년') + '</h2><div class="grid">'; }
    html += '<a class="card" href="' + u.path + '"><div class="meta">' + (u.grade && u.source !== 'chat' ? '<span class="uid">' + esc(u.id) + '</span> ' : '') + esc(u.chapter) +
      (u.status ? '<span class="tag">' + esc(u.status) + '</span>' : '') + '</div><h3>' + esc(u.title) +
      '</h3><p>' + esc(u.summary || '') + '</p></a>';
  });
  document.getElementById('list').innerHTML = html + (cur !== null ? '</div>' : '<p class="hint">아직 등록된 단원이 없어요.</p>');
}).catch(function () {
  document.getElementById('list').innerHTML = '<p class="hint">목록을 불러오지 못했어요. 잠시 후 새로고침해 주세요.</p>';
});
function roman(c) { var m = /^\s*([ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ])/.exec(c || ''); return m ? 'ⅠⅡⅢⅣⅤⅥⅦⅧⅨⅩ'.indexOf(m[1]) + 1 : 99; }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
</script>
</body>
</html>
